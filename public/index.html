<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Usage Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow"><span id="live-dot" class="live-dot"></span><span id="connection">연결 중</span></div>
          <h1>Codex Usage Monitor</h1>
          <p>로컬 rollout 기록을 세션과 서브에이전트 단위로 집계합니다.</p>
        </div>
        <div class="actions">
          <select id="days" aria-label="조회 기간">
            <option value="today" selected>오늘</option>
            <option value="7">7일</option>
            <option value="30">30일</option>
            <option value="90">90일</option>
          </select>
          <button id="rescan" type="button">다시 스캔</button>
        </div>
      </header>

      <section id="summary" class="summary" aria-label="요약"></section>
      <section class="section-heading">
        <h2>프롬프트 실행 목록 · <span id="list-period">오늘</span></h2>
        <span id="updated-at"></span>
      </section>
      <section id="turn-list" class="turn-list" aria-live="polite"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
